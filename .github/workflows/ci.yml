name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements-local.txt
      - run: python -m unittest discover -s tests
      - run: python evals/run.py
      - run: python evals/answerability.py
      - run: python evals/excerpts.py
      - run: python evals/local.py --output .rag-data/eval/local-latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-candidate-eval
          path: .rag-data/eval/local-latest.json
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/web.test.mjs
